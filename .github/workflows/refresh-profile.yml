name: Refresh profile pictures

# Re-captures tlauom.com for the organisation profile README:
# every Monday, whenever the capture scripts change, or by hand
# (Actions tab → "Refresh profile pictures" → Run workflow).
on:
  schedule:
    - cron: "30 2 * * 1" # Monday 08:00 Sri Lanka time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package.json"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-core

      - name: Capture tlauom.com
        run: npm run capture

      - name: Commit new pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh profile pictures from tlauom.com"
            git push
          fi
